[project]
name = "dgis-omop-etl"
version = "0.1.0"
description = "ETL pipeline for Mexican DGIS hospital discharge data into OMOP CDM v5.4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Roberto Olvera Hernández" },
]

dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandera>=0.19",
]

[project.scripts]
dgis-etl = "src.python.etl.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]